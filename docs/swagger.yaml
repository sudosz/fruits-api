basePath: /
definitions:
  models.CreateFruitRequest:
    properties:
      color:
        example: red
        type: string
      fruit:
        example: apple
        type: string
    required:
    - color
    - fruit
    type: object
  models.Fruit:
    properties:
      color:
        example: red
        type: string
      fruit:
        example: apple
        type: string
      id:
        example: 1
        type: integer
    required:
    - color
    - fruit
    type: object
host: localhost:8080
info:
  contact: {}
  description: RESTful API for managing fruits, backed by PostgreSQL.
  title: Fruits API
  version: "1.0"
paths:
  /fruits:
    get:
      description: Returns every fruit in the database, or an empty array when there
        are none.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Fruit'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all fruits
      tags:
      - fruits
    post:
      consumes:
      - application/json
      description: Adds a fruit and returns it with the generated ID.
      parameters:
      - description: Fruit to create
        in: body
        name: fruit
        required: true
        schema:
          $ref: '#/definitions/models.CreateFruitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Fruit'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a fruit
      tags:
      - fruits
  /fruits/{id}:
    get:
      description: Returns a single fruit.
      parameters:
      - description: Fruit ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Fruit'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a fruit by ID
      tags:
      - fruits
  /healthz:
    get:
      description: Reports service readiness, including database connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - operations
schemes:
- http
- https
swagger: "2.0"
