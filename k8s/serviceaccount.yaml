---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fruits-api
  labels:
    app: fruits-api
    app.kubernetes.io/part-of: fruits-api
# The API never calls the Kubernetes API, so it gets no token mounted.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: fruits-api
automountServiceAccountToken: false
