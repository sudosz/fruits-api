apiVersion: v1
kind: Service
metadata:
  name: fruits-api
  labels:
    app: fruits-api
spec:
  # NodePort so the API is reachable on minikube/kind without an ingress.
  # Switch to ClusterIP when fronting it with an ingress controller.
  type: NodePort
  selector:
    app: fruits-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
