# Template only. Do NOT commit real credentials.
#
# Create the live Secret out-of-band instead:
#
#   kubectl create secret generic fruits-api-secret \
#     --from-literal=DB_USER=postgres \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
#
# For GitOps, use a sealed/encrypted variant (sealed-secrets, SOPS) or pull the
# values from a manager via External Secrets Operator. Plaintext Secret YAML in
# git is base64, not encryption: anyone with repo read access has the password.
apiVersion: v1
kind: Secret
metadata:
  name: fruits-api-secret
  labels:
    app.kubernetes.io/part-of: fruits-api
type: Opaque
stringData:
  DB_USER: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
