# Base defaults for the fruits-api chart.

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  # The runnable multi-arch image. Cosign signature artifacts (*.sig) are not
  # runnable and must never be used here.
  repository: ghcr.io/sudosz/fruits-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

containerPort: 8080

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Application configuration rendered into the ConfigMap. Keys map 1:1 onto the
# environment variables read by internal/config.
config:
  PORT: "8080"
  GIN_MODE: release
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: fruitsdb
  DB_SSLMODE: disable
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "25"
  DB_CONN_MAX_LIFETIME: 5m
  DB_CONN_MAX_IDLE_TIME: 1m
  DB_CONNECT_TIMEOUT: 30s
  DB_MIGRATE_TIMEOUT: 15s
  RATE_LIMIT_PER_SECOND: "50"
  RATE_LIMIT_BURST: "100"
  RATE_LIMIT_REAP_INTERVAL: 10m
  MAX_BODY_BYTES: "8192"
  SERVER_READ_HEADER_TIMEOUT: 5s
  SERVER_READ_TIMEOUT: 15s
  SERVER_WRITE_TIMEOUT: 15s
  SERVER_IDLE_TIMEOUT: 60s
  SERVER_SHUTDOWN_TIMEOUT: 10s

# Database credentials. For real environments disable `create` and point
# `existingSecret` at a secret managed outside the chart (sealed-secrets,
# External Secrets, cloud secret manager, ...).
secret:
  create: true
  existingSecret: ""
  data:
    DB_USER: postgres
    DB_PASSWORD: postgres

# PostgreSQL version used by the environment this chart targets. Kept here so
# the image tag is declared in one place alongside compose and CI.
postgres:
  image: postgres:17-alpine

networkPolicy:
  enabled: true
  # Namespace selector labels allowed to reach the API.
  ingressNamespaceSelector: {}
  # Extra ingress peers, appended verbatim.
  extraIngress: []
  # Egress to the database.
  databasePort: 5432
  databasePodSelector:
    app.kubernetes.io/name: postgres

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
