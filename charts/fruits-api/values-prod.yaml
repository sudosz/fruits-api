# Production overrides: helm upgrade --install fruits-api charts/fruits-api -f charts/fruits-api/values-prod.yaml

replicaCount: 3

image:
  # Pin an immutable digest or semver tag in production; `latest` is only a
  # convenience default. The runnable image is ghcr.io/sudosz/fruits-api -
  # Cosign `.sig` artifacts are signatures, not images.
  tag: latest
  pullPolicy: IfNotPresent

config:
  GIN_MODE: release
  DB_HOST: postgres
  DB_NAME: fruitsdb
  DB_SSLMODE: require
  DB_MAX_OPEN_CONNS: "50"
  DB_MAX_IDLE_CONNS: "25"
  RATE_LIMIT_PER_SECOND: "100"
  RATE_LIMIT_BURST: "200"
  SERVER_SHUTDOWN_TIMEOUT: 20s

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: fruits-api

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fruits-api

networkPolicy:
  enabled: true

# Credentials must come from an externally managed secret in production.
secret:
  create: false
  existingSecret: fruits-api-db
