x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  <<: *security-opts

services:
  db:
    <<: *service-defaults
    image: postgres:17-alpine
    container_name: fruits-db
    environment:
      POSTGRES_DB: fruitsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Not published to the host: only the api service needs to reach it.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fruitsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *service-defaults
    build:
      context: .
    container_name: fruits-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fruitsdb
      DB_SSLMODE: disable
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    # The binary is static and writes nothing outside /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

volumes:
  postgres_data:
